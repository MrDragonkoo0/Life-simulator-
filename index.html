<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Life+ — Головна</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">LIFE<span>+</span></div>
        <div class="subtitle">Твоя історія починається тут</div>
      </div>
      <button class="icon-btn" id="profileTop" aria-label="Профіль">👤</button>
    </header>

    <section class="hero">
      <div class="hero-glow"></div>
      <div class="hero-content">
        <div class="level-pill">РІВЕНЬ <b id="level">1</b></div>
        <h1 id="playerName">Гравець</h1>
        <p>Побудуй життя з нуля.</p>
      </div>
    </section>

    <section class="balance-card">
      <div>
        <span class="muted">Баланс</span>
        <strong id="balance">₴1 000</strong>
      </div>
      <div class="wallet-icon">₴</div>
    </section>

    <section class="quick-stats">
      <div class="stat"><span>🏠</span><small>Житло</small><b>Кімната</b></div>
      <div class="stat"><span>💼</span><small>Робота</small><b>Немає</b></div>
      <div class="stat"><span>🚗</span><small>Транспорт</small><b>Немає</b></div>
    </section>

    <section class="menu-grid">
      <button class="menu-card" data-section="profile"><span>👤</span><b>Профіль</b><small>Твоя статистика</small></button>
      <button class="menu-card" data-section="work"><span>💼</span><b>Робота</b><small>Заробляй гроші</small></button>
      <button class="menu-card" data-section="housing"><span>🏠</span><b>Житло</b><small>Оренда та нерухомість</small></button>
      <button class="menu-card" data-section="transport"><span>🚗</span><b>Транспорт</b><small>Авто та інше</small></button>
      <button class="menu-card" data-section="businesses"><span>🏢</span><b>Бізнеси</b><small>Створюй свою справу</small></button>
      <button class="menu-card" data-section="bank"><span>🏦</span><b>Банк</b><small>Рахунки та фінанси</small></button>
      <button class="menu-card" data-section="shop"><span>🛒</span><b>Магазин</b><small>Покупки</small></button>
      <button class="menu-card" data-section="tasks"><span>📋</span><b>Завдання</b><small>Отримуй нагороди</small></button>
      <button class="menu-card" data-section="players"><span>👥</span><b>Гравці</b><small>Соціальне життя</small></button>
      <button class="menu-card" data-section="settings"><span>⚙️</span><b>Налаштування</b><small>Параметри гри</small></button>
    </section>

    <footer>Life+ v0.1.0</footer>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
