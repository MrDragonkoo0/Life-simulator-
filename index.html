<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#080b12">
    <title>Life+</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="app" id="app">
    <header class="topbar" id="mainTopbar">
        <div class="player">
            <div class="avatar">👤</div>
            <div>
                <div class="player-name">Новачок</div>
                <div class="player-level">Рівень 1</div>
            </div>
        </div>
        <button class="notification" id="notifications" aria-label="Сповіщення">
            🔔<span class="notification-dot"></span>
        </button>
    </header>

    <div id="view"></div>
</main>

<div class="toast" id="toast">Розділ поки що в розробці</div>
<script type="module" src="app.js"></script>
</body>
</html>
